<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Préstamos — Aula de Innovación Pedagógica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --navy:#154C2E; --navy-light:#1D7A46; --navy-lighter:#2E9457;
    --cream:#F7F4EC; --paper:#FFFFFF;
    --amber:#E8871E; --amber-dark:#C96A0C;
    --green:#2E7D53; --green-bg:#E4F2E9;
    --red:#C0453A; --red-bg:#FBE9E7;
    --ink:#182430; --ink-soft:#5B6B78;
    --line:#E4DFD1;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--cream);color:var(--ink);}
  .app{display:flex;min-height:100vh;}

  /* Franjas verdes con blanco */
  .top-stripe{height:10px;width:100%;background:repeating-linear-gradient(135deg, var(--navy) 0 16px, #ffffff 16px 24px);flex-shrink:0;}
  .topbar-stripe{height:5px;width:100%;background:repeating-linear-gradient(135deg, var(--navy-light) 0 12px, #ffffff 12px 18px);flex-shrink:0;}
  .brand-logo{width:46px;height:auto;flex-shrink:0;border-radius:5px;box-shadow:0 1px 4px rgba(0,0,0,.35);}

  /* Sidebar */
  .sidebar{width:230px;background:var(--navy);color:#EDEFF1;display:flex;flex-direction:column;flex-shrink:0;}
  .brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
  .brand-mark{display:flex;align-items:center;gap:10px;}
  .brand-mark svg{flex-shrink:0;}
  .brand-title{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.25;letter-spacing:.2px;}
  .brand-sub{font-size:11px;color:#BFE3CD;margin-top:2px;font-weight:600;letter-spacing:.3px;}
  nav{padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#C9D3DA;background:transparent;border:none;cursor:pointer;font-family:var(--font-body);font-size:13.5px;font-weight:500;text-align:left;transition:background .15s;}
  .nav-btn:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-btn.active{background:var(--amber);color:#1A1000;font-weight:600;}
  .nav-btn svg{flex-shrink:0;opacity:.9;}
  .sidebar-foot{padding:14px 20px 4px;font-size:10.5px;color:#B9CFC0;border-top:1px solid rgba(255,255,255,.08);line-height:1.5;}
  .sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle;}
  .sync-dot.on{background:#4ADE80;box-shadow:0 0 4px #4ADE80;}
  .sync-dot.connecting{background:#E8871E;animation:pulse 1s infinite;}
  .sync-dot.error{background:#EF4444;}
  .sync-dot.off{background:#7C8D9A;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .sidebar-credit{padding:0 20px 14px;font-size:10px;color:#7FA98D;}

  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  header.topbar{background:var(--paper);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .topbar h1{font-family:var(--font-display);font-size:19px;margin:0;font-weight:700;}
  .topbar .inst-name{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .content{padding:26px 28px 60px;flex:1;}

  /* Cards / grid */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .card .num{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1;}
  .card .lbl{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .card.accent .num{color:var(--amber-dark);}
  .card.green .num{color:var(--green);}
  .card.red .num{color:var(--red);}

  section.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:20px;}
  .panel h2{font-family:var(--font-display);font-size:16px;margin:0 0 14px;font-weight:700;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .panel-head h2{margin:0;}

  /* Buttons */
  button{cursor:pointer;font-family:var(--font-body);}
  .btn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;background:var(--navy);color:#fff;}
  .btn:hover{background:var(--navy-light);}
  .btn.primary{background:var(--amber);color:#1A1000;}
  .btn.primary:hover{background:var(--amber-dark);color:#fff;}
  .btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
  .btn.ghost:hover{background:#F0EDE2;}
  .btn.danger{background:var(--red-bg);color:var(--red);}
  .btn.danger:hover{background:var(--red);color:#fff;}
  .btn.sm{padding:6px 11px;font-size:12px;border-radius:6px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* Forms */
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 4px;}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;font-family:var(--font-body);background:#fff;color:var(--ink);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber);}
  .field{margin-bottom:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

  /* Table */
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--line);}
  td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:hover td{background:#FBFAF5;}
  .code-tag{font-family:var(--font-mono);font-size:12px;background:#EFEBDD;padding:2px 7px;border-radius:5px;color:#4A4230;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .badge.disp{background:var(--green-bg);color:var(--green);}
  .badge.prest{background:#FFF1DE;color:var(--amber-dark);}
  .badge.venc{background:var(--red-bg);color:var(--red);}
  .badge.dev{background:#EEF0F2;color:var(--ink-soft);}
  .empty{padding:30px;text-align:center;color:var(--ink-soft);font-size:13px;}
  .searchbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .searchbar input,.searchbar select{width:auto;flex:1;min-width:160px;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(16,41,58,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal h3{font-family:var(--font-display);margin:0 0 16px;font-size:17px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .close-x{float:right;background:none;border:none;font-size:18px;color:var(--ink-soft);}

  /* QR bits */
  .qr-box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;background:#FAFAF6;border:1px dashed var(--line);border-radius:10px;}
  .qr-box .qcode{font-family:var(--font-mono);font-weight:600;font-size:14px;}
  #reader{width:100%;max-width:460px;margin:0 auto;}
  #reader video{border-radius:10px;}
  .cam-wrap{margin-top:12px;padding:16px;background:#FAFAF6;border:1px dashed var(--line);border-radius:10px;}
  .cam-hint{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:10px;}
  .person-pick-row{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .person-pick-row:hover{background:#F5F2E6;border-color:var(--amber);}
  .scan-row{display:flex;gap:8px;align-items:flex-end;}
  .scan-row .field{flex:1;margin-bottom:0;}
  .found-box{margin-top:12px;padding:12px 14px;border-radius:9px;background:#F3F6F3;border:1px solid var(--line);font-size:13px;}
  .found-box.bad{background:var(--red-bg);}

  .import-modal{max-width:680px;}
  .import-drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;background:#FAFAF6;}
  .import-drop input[type=file]{width:auto;display:inline-block;}
  .import-help{font-size:12px;color:var(--ink-soft);margin-top:8px;}
  .import-table-wrap{max-height:280px;overflow-y:auto;margin-top:14px;border:1px solid var(--line);border-radius:8px;}
  .import-table-wrap table{font-size:12.5px;}
  .import-table-wrap th{position:sticky;top:0;background:#fff;}
  .row-ok{color:var(--green);}
  .row-warn{color:var(--amber-dark);}
  .row-bad{color:var(--red);}
  .import-summary{margin-top:10px;font-size:13px;}

  .person-loan-group{margin-bottom:18px;}
  .person-loan-group:last-child{margin-bottom:0;}
  .person-loan-head{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:600;font-size:13.5px;border-bottom:2px solid var(--line);margin-bottom:6px;}

  .cart-row{padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;background:#fff;}
  .cart-row .code-tag{margin-left:6px;}

  .labels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
  .label-card{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;background:#fff;}
  .label-card .qcode{font-family:var(--font-mono);font-weight:600;font-size:12px;margin-top:6px;}
  .label-card .qname{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:99;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}

  @media print{
    .sidebar, header.topbar, .no-print{display:none !important;}
    .content{padding:0;}
    section.panel{border:none;padding:0;}
  }
  @media (max-width:820px){
    .sidebar{width:64px;}
    .brand-title,.brand-sub,.nav-btn span.lbl-text,.sidebar-foot,.sidebar-credit{display:none;}
    .nav-btn{justify-content:center;}
    .grid2,.grid3{grid-template-columns:1fr;}
  }
  .grade-badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:#E7F0FF;color:#2B5CB0;margin-left:6px;}
  .role-note{font-size:12px;font-weight:500;color:var(--ink-soft);margin-left:6px;}
  .picker-scroll{max-height:340px;overflow-y:auto;padding-right:2px;}
  .pw-hint{font-size:12px;color:var(--ink-soft);}
  .embed-box{margin-top:14px;padding:12px 14px;background:#F3F8F3;border:1px solid var(--line);border-radius:9px;font-size:12.5px;color:var(--ink-soft);}
</style>
</head>

      hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++) for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16); }
  return result;
}
const hasCloudStorage = (typeof window.storage !== 'undefined' && window.storage !== null);

function loadSyncConfig(){
  try{
    const raw = localStorage.getItem(SYNC_CONFIG_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveSyncConfigLocal(cfg){ try{ localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg)); }catch(e){} }
function clearSyncConfigLocal(){ try{ localStorage.removeItem(SYNC_CONFIG_KEY); }catch(e){} }

const Persist = {
  async get(){
    if(hasCloudStorage){
      try{ return await window.storage.get('app-data', true); }
      catch(e){ /* aún no existe */ }
    }
    try{
      const raw = localStorage.getItem(LOCAL_KEY);
      return raw ? { value: raw } : null;
    }catch(e){ return null; }
  },
  async set(value){
    if(hasCloudStorage){
      try{
        const res = await window.storage.set('app-data', value, true);
        if(res) return true;
      }catch(e){ /* si falla, igual respaldamos localmente */ }
    }
    try{ localStorage.setItem(LOCAL_KEY, value); return true; }
    catch(e){ return false; }
  }
};

const App = {
  state:{ resources:[], people:[], loans:[], settings:{ institutionName:'I.E. "JOSÉ SANTOS FIGUEROA"' } },
  view:'public', isAdmin:false,

  // --- Sincronización en línea (Firebase) ---
  syncConfig:null, syncDb:null, syncReady:false, syncStatus:'off', // off | connecting | on | error
  syncUnsub:null, _applyingRemote:false,

  async connectSync(cfg){
    this.syncStatus = 'connecting';
    this.renderSyncBadge();
    try{
      if(firebase.apps && firebase.apps.length){
        await Promise.all(firebase.apps.map(a=>a.delete()));
      }
      firebase.initializeApp(cfg);
      this.syncDb = firebase.firestore();
      // probamos la conexión leyendo el documento una vez
      await this.syncDb.collection('controlAIP').doc('app-data').get();
      this.syncConfig = cfg;
      this.syncReady = true;
      this.syncStatus = 'on';
      saveSyncConfigLocal(cfg);
      this.startRealtimeListener();
      return true;
    }catch(e){
      console.error('Error conectando sincronización en línea', e);
      this.syncReady = false;
      this.syncStatus = 'error';
      this.renderSyncBadge();
      return false;
    }
  },

  disconnectSync(){
    if(this.syncUnsub){ this.syncUnsub(); this.syncUnsub = null; }
    this.syncReady = false;
    this.syncConfig = null;
    this.syncStatus = 'off';
    clearSyncConfigLocal();
    this.renderSyncBadge();
  },

  startRealtimeListener(){
    if(!this.syncDb) return;
    if(this.syncUnsub) this.syncUnsub();
    const docRef = this.syncDb.collection('controlAIP').doc('app-data');
    this.syncUnsub = docRef.onSnapshot(snap=>{
      this.syncStatus = 'on';
      this.renderSyncBadge();
      if(!snap.exists) return;
      const data = snap.data();
      if(data && typeof data.json === 'string' && data.json !== this._lastSavedJson){
        this._applyingRemote = true;
        try{ this.state = JSON.parse(data.json); }catch(e){}
        this.ensureDefaults();
        this.restoreAdminSession();
        this.renderNav();
        this.renderView();
        this._applyingRemote = false;
      }
    }, err=>{
      console.error('Error de sincronización en tiempo real', err);
      this.syncStatus = 'error';
      this.renderSyncBadge();
    });
  },

  ensureDefaults(){
    if(!this.state.resources) this.state.resources = [];
    if(!this.state.people) this.state.people = [];
    if(!this.state.loans) this.state.loans = [];
    if(!this.state.settings) this.state.settings = { institutionName:'I.E. "JOSÉ SANTOS FIGUEROA"' };
  },

  async load(){
    this.syncConfig = EMBEDDED_FIREBASE_CONFIG || loadSyncConfig();
    if(this.syncConfig){
      const ok = await this.connectSync(this.syncConfig);
      if(!ok){ this.toast('⚠ No se pudo conectar la sincronización en línea. Usando almacenamiento local.'); }
    }
    // Cargamos el último estado disponible (de Firebase si ya llegó el snapshot, o local) para no mostrar vacío mientras conecta
    if(!this.syncReady){
      try{
        const r = await Persist.get();
        if(r && r.value){ this.state = JSON.parse(r.value); }
      }catch(e){ /* no existing data yet, keep defaults */ }
    }
    this.ensureDefaults();
    this.restoreAdminSession();
    this.renderNav();
    this.renderView();
  },

  async save(){
    this.ensureDefaults();
    const json = JSON.stringify(this.state);
    this._lastSavedJson = json;
    if(this.syncReady && this.syncDb){
      try{
        await this.syncDb.collection('controlAIP').doc('app-data').set({ json, updatedAt: Date.now() });
        try{ localStorage.setItem(LOCAL_KEY, json); }catch(e){} // respaldo local por si se pierde internet
        return;
      }catch(e){
        console.error('Error guardando en línea', e);
        this.toast('⚠ Sin conexión con el servidor en línea. Se guardó localmente.');
      }
    }
    const ok = await Persist.set(json);
    if(!ok){ console.error('No se pudo guardar los datos.'); this.toast('⚠ No se pudo guardar. Intenta de nuevo.'); }
  },

  toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
  },

  uid(){ return 'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); },


  genCode(extraUsed){
    const prefix = 'AIP';
    const nums = this.state.resources
      .filter(r=>r.code.startsWith(prefix+'-'))
      .map(r=>parseInt(r.code.split('-')[1],10)||0);
    let next = (nums.length? Math.max(...nums):0)+1;
    if(extraUsed){
      let code = prefix+'-'+String(next).padStart(3,'0');
      while(extraUsed.has(code)){ next++; code = prefix+'-'+String(next).padStart(3,'0'); }
      return code;
    }
    return prefix+'-'+String(next).padStart(3,'0');
  },

  fmtDate(iso){
    if(!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' +
           d.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
  },

  daysBetween(a,b){
    return Math.max(0, Math.round((b-a)/(1000*60*60*24)));
  },

  saveResource(id){

    const code = document.getElementById('fCode').value.trim();
    const brand = document.getElementById('fBrand').value.trim();

    this.save(); this.renderView();

  importRows:[],

  openImportExcel(){
    const body = `
      <button class="close-x" onclick="App.closeModal()">✕</button>
      <div class="import-modal">
      <h3>Cargar recursos desde Excel</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin-top:-8px;">
        El archivo debe tener columnas: <strong>Código Patrimonial</strong>, <strong>Descripción</strong>, <strong>Marca</strong>,
        <strong>Modelo</strong>, <strong>N° Serie</strong>, <strong>Estado de Conservación</strong> y <strong>Ubicación</strong>.
        Si no pones código patrimonial, se genera uno automáticamente.
      </p>
      <div class="import-drop">
        <input type="file" id="excelFile" accept=".xlsx,.xls,.csv" onchange="App.handleExcelFile(this.files[0])">
        <div class="import-help">Formatos aceptados: .xlsx, .xls, .csv</div>
      </div>
      <div style="margin-top:10px;">
        <button class="btn ghost sm" onclick="App.downloadTemplate()">⬇ Descargar plantilla de ejemplo</button>
      </div>
      <div id="importPreview"></div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="App.closeModal()">Cancelar</button>
        <button class="btn primary" id="importConfirmBtn" onclick="App.confirmImport()" disabled>Importar recursos</button>
      </div>
      </div>`;
    this.showModal(body);
    this.importRows = [];
    this.lastDetectedHeaders = [];
  },

  downloadTemplate(){
    const wb = XLSX.utils.book_new();
    const data = [
      ['Codigo Patrimonial','Descripcion','Marca','Modelo','N Serie','Estado de Conservacion','Ubicacion'],
      ['','Tablet Samsung A8','Samsung','SM-X200','SN123456','Bueno','Aula de Innovación Pedagógica'],
      ['','Laptop Lenovo ThinkPad','Lenovo','ThinkPad E14','SN654321','Bueno','Aula de Innovación Pedagógica'],
      ['','Cable VGA 3m','Genérico','','','Regular','Aula de Innovación Pedagógica']
    ];
    const ws = XLSX.utils.aoa_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, 'Recursos');
    XLSX.writeFile(wb, 'plantilla-recursos.xlsx');
  },

  normalizeKey(k){
    return String(k||'').trim().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // quita tildes
      .replace(/[°ºª.]/g,'').replace(/\s+/g,' ').trim();
  },

  // Palabras clave que identifican una fila de encabezados (aunque no sea la primera fila del archivo)
  headerKeywords:[
    'codigo','patrimonial','descripcion','denominacion','bien','nombre',
    'marca','modelo','serie','conservacion','estado','ubicacion','ambiente','area','lugar'
  ],

  findHeaderRow(grid){
    let bestIdx = 0, bestScore = -1;
    const scanRows = Math.min(grid.length, 15);
    for(let i=0;i<scanRows;i++){
      const row = grid[i]||[];
      let score = 0;
      row.forEach(cell=>{
        const c = this.normalizeKey(cell);
        if(!c) return;
        if(this.headerKeywords.some(kw=>c.includes(kw))) score++;
      });
      if(score>bestScore){ bestScore=score; bestIdx=i; }
    }
    return { idx:bestIdx, score:bestScore };
  },

  handleExcelFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:'array'});
        // Elegimos la hoja con más contenido (por si la primera es una portada)
        let bestSheet = wb.SheetNames[0], bestRows = -1;
        wb.SheetNames.forEach(name=>{
          const g = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:'', blankrows:false});
          if(g.length>bestRows){ bestRows=g.length; bestSheet=name; }
        });
        const grid = XLSX.utils.sheet_to_json(wb.Sheets[bestSheet], {header:1, defval:'', blankrows:false});
        if(!grid.length){ this.toast('El archivo parece estar vacío.'); return; }
        const {idx:headerIdx, score} = this.findHeaderRow(grid);
        const headers = (grid[headerIdx]||[]).map(h=>this.normalizeKey(h));
        const dataRows = grid.slice(headerIdx+1);
        this.lastDetectedHeaders = (grid[headerIdx]||[]).filter(h=>String(h).trim()!=='');
        if(score<2){
          this.toast('No se pudieron identificar bien las columnas. Revisa el resultado y los encabezados detectados.');
        }
        const rawRows = dataRows
          .filter(r=> r.some(c=>String(c).trim()!==''))
          .map(r=>{ const obj={}; headers.forEach((h,i)=>{ if(h) obj[h]=r[i]; }); return obj; });
        this.processImportRows(rawRows);
      }catch(err){
        this.toast('No se pudo leer el archivo. Verifica el formato.');
        console.error(err);
      }
    };
    reader.readAsArrayBuffer(file);
  },

  mapConservation(val){
    const v = this.normalizeKey(val);
    if(!v) return '';
    if(v==='b'||v==='bueno') return 'Bueno';
    if(v==='r'||v==='regular') return 'Regular';
    if(v==='m'||v==='malo') return 'Malo';
    if(v==='n'||v==='nuevo') return 'Nuevo';
    if(v.includes('baja')||v.includes('inoperativo')) return 'Inoperativo / De baja';
    return String(val).trim();
  },

  processImportRows(rawRows){
    const usedCodes = new Set(this.state.resources.map(r=>r.code.toUpperCase()));
    const batch = [];
    rawRows.forEach(raw=>{
      const norm = {};
      Object.keys(raw).forEach(k=> norm[this.normalizeKey(k)] = raw[k]);
      const get = (...keys)=>{ for(const k of keys){ if(norm[k]!==undefined && String(norm[k]).trim()!=='') return String(norm[k]).trim(); } return ''; };
      const description = get(
        'descripcion','descripción','nombre','recurso','denominacion','denominación',
        'bien','denominacion del bien','nombre del bien','descripcion del bien','articulo','equipo'
      );
      let code = get(
        'codigo patrimonial','código patrimonial','codigo','código','cod patrimonial',
        'nro patrimonial','n patrimonial','patrimonio','item patrimonial','codigo de barras'
      );
      const brand = get('marca');
      const model = get('modelo');
      const serial = get(
        'n serie','n° serie','no serie','nro serie','numero de serie','número de serie',
        'serie','n de serie'
      );
      const conservationRaw = get(
        'estado de conservacion','estado de conservación','conservacion','conservación','estado'
      );
      const conservation = this.mapConservation(conservationRaw);
      const location = get('ubicacion','ubicación','ubicacion fisica','ambiente','area','área','lugar');

      let status='ok', msg='Listo para importar';
      if(!description){ status='bad'; msg='Falta la descripción'; }
      if(status!=='bad'){
        if(!code){ code = this.genCode(usedCodes); }
        code = code.toUpperCase();
        if(usedCodes.has(code)){
          status='warn'; msg=`El código ${code} ya existe, se generará uno nuevo`;
          code = this.genCode(usedCodes);
          msg += ` (${code})`;
        }
        usedCodes.add(code);
      }
      batch.push({description, code, brand, model, serial, conservation, location, status, msg});
    });
    this.importRows = batch;
    this.renderImportPreview();
  },

  renderImportPreview(){
    const box = document.getElementById('importPreview');
    const valid = this.importRows.filter(r=>r.status!=='bad');
    if(this.importRows.length===0){ box.innerHTML=''; document.getElementById('importConfirmBtn').disabled=true; return; }
    const detected = this.lastDetectedHeaders && this.lastDetectedHeaders.length
      ? `<div class="import-help" style="margin-top:8px;">Columnas detectadas en tu archivo: ${this.lastDetectedHeaders.map(h=>`<span class="code-tag">${h}</span>`).join(' ')}</div>`
      : '';
    box.innerHTML = `
      ${detected}
      <div class="import-table-wrap">
        <table><thead><tr><th>Código</th><th>Descripción</th><th>Marca/Modelo</th><th>Ubicación</th><th>Estado</th></tr></thead><tbody>
        ${this.importRows.map(r=>`
          <tr>
            <td><span class="code-tag">${r.code||'—'}</span></td>
            <td>${r.description||'<em>—</em>'}</td>
            <td>${[r.brand,r.model].filter(Boolean).join(' / ')||'—'}</td>
            <td>${r.location||'—'}</td>
            <td class="row-${r.status}">${r.msg}</td>
          </tr>`).join('')}
        </tbody></table>
      </div>
      <div class="import-summary">${valid.length} de ${this.importRows.length} fila(s) se importarán.
      ${valid.length===0? ' Si tus columnas se llaman distinto a lo esperado, revisa la lista de columnas detectadas arriba y ajusta los encabezados de tu Excel (por ejemplo "DENOMINACIÓN DEL BIEN" para la descripción).':''}</div>`;
    document.getElementById('importConfirmBtn').disabled = valid.length===0;
  },

  confirmImport(){
    const valid = this.importRows.filter(r=>r.status!=='bad');
    valid.forEach(r=>{
      this.state.resources.push({
        id:this.uid(), code:r.code, description:r.description,
        brand:r.brand, model:r.model, serial:r.serial, conservation:r.conservation, location:r.location,
        status:'disponible', createdAt:new Date().toISOString()
      });
    });
    this.save(); this.closeModal(); this.renderView();
    this.toast(`Se importaron ${valid.length} recurso(s).`);
    this.importRows = [];
  },

  openQr(id){
    const r = this.state.resources.find(x=>x.id===id);
    const label = r.serial || r.code;
    const body = `
      <button class="close-x" onclick="App.closeModal()">✕</button>
      <h3>Código QR — ${r.description}</h3>
      <div class="qr-box">
        <div id="qrSingle"></div>

        ${!r.serial? `<div style="font-size:11px;color:var(--amber-dark);">(sin N° serie, usando código patrimonial)</div>`:''}
        <div style="font-size:12px;color:var(--ink-soft);">${[r.brand,r.model].filter(Boolean).join(' ')}</div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="window.print()">Imprimir</button>
        <button class="btn primary" onclick="App.closeModal()">Cerrar</button>
      </div>`;
    this.showModal(body);
    new QRCode(document.getElementById('qrSingle'), { text:label, width:150, height:150, colorDark:'#10293A', colorLight:'#ffffff' });
  },

    else { this.state.people.push({ id:this.uid(), ...data }); }
    this.save(); this.closeModal(); this.renderView();
    this.toast('Estudiante guardado.');
  },

  deletePerson(id){
    const activo = this.state.loans.find(l=>l.personId===id && l.status==='activo');
    if(activo){ this.toast('Esta persona tiene un préstamo activo, no se puede eliminar.'); return; }
    if(!confirm('¿Eliminar este registro?')) return;
    this.state.people = this.state.people.filter(p=>p.id!==id);
    this.save(); this.renderView();
  },

  /* ---------------------------------------------------------
     CARGA MASIVA DESDE EXCEL (personal y estudiantes)
  --------------------------------------------------------- */
  peopleImportRows:[],
  lastDetectedPeopleHeaders:[],
  importKind:'personal',

  openImportPeopleExcel(kind){
    this.importKind = kind==='estudiante' ? 'estudiante' : 'personal';
    const stu = this.importKind==='estudiante';
    const body = `
      <button class="close-x" onclick="App.closeModal()">✕</button>
      <div class="import-modal">

          : 'El archivo debe tener columnas: <strong>Nombres y Apellidos</strong>, <strong>Cargo</strong> y <strong>Área</strong>.'}
      </p>
      <div class="import-drop">
        <input type="file" id="peopleExcelFile" accept=".xlsx,.xls,.csv" onchange="App.handlePeopleExcelFile(this.files[0])">

      </div>
      </div>`;
    this.showModal(body);
    this.peopleImportRows = [];
    this.lastDetectedPeopleHeaders = [];
  },

  downloadPeopleTemplate(){
    const stu = this.importKind==='estudiante';
    const wb = XLSX.utils.book_new();
    const data = stu ? [
      ['Nombres y Apellidos','Grado y Sección'],
      ['Ana Torres Díaz','1A'],
      ['Luis Pérez Rojas','2B'],
      ['Rosa Quispe Mamani','5B']
    ] : [
      ['Nombres y Apellidos','Cargo','Área'],
      ['María Quispe Rojas','Docente','Comunicación'],
      ['Juan Pérez Ramos','Auxiliar de educación','Primaria']
    ];
    const ws = XLSX.utils.aoa_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, stu? 'Estudiantes' : 'Personal');
    XLSX.writeFile(wb, stu? 'plantilla-estudiantes.xlsx' : 'plantilla-personal.xlsx');
  },

  mapRole(val){
    const v = this.normalizeKey(val);
    if(!v) return 'Otro';
    if(v.includes('docente')) return 'Docente';
    if(v.includes('auxiliar')) return 'Auxiliar de educación';
    if(v.includes('administrativ')) return 'Personal administrativo';
    if(v.includes('director')||v.includes('directivo')||v.includes('subdirector')) return 'Directivo';
    return String(val).trim() || 'Otro';
  },

  handlePeopleExcelFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:'array'});
        let bestSheet = wb.SheetNames[0], bestRows = -1;
        wb.SheetNames.forEach(name=>{
          const g = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:'', blankrows:false});
          if(g.length>bestRows){ bestRows=g.length; bestSheet=name; }
        });
        const grid = XLSX.utils.sheet_to_json(wb.Sheets[bestSheet], {header:1, defval:'', blankrows:false});
        if(!grid.length){ this.toast('El archivo parece estar vacío.'); return; }
        const kw = ['nombre','apellido','cargo','area','ambito','puesto','funcion','grado','seccion','aula'];
        let bestIdx=0, bestScore=-1;
        const scanRows = Math.min(grid.length,15);
        for(let i=0;i<scanRows;i++){
          const row = grid[i]||[];
          let score=0;
          row.forEach(cell=>{
            const c = this.normalizeKey(cell);
            if(!c) return;
            if(kw.some(k=>c.includes(k))) score++;
          });
          if(score>bestScore){ bestScore=score; bestIdx=i; }
        }
        const headers = (grid[bestIdx]||[]).map(h=>this.normalizeKey(h));
        const dataRows = grid.slice(bestIdx+1);
        this.lastDetectedPeopleHeaders = (grid[bestIdx]||[]).filter(h=>String(h).trim()!=='');
        if(bestScore<1){
          this.toast('No se pudieron identificar bien las columnas. Revisa las columnas detectadas.');
        }
        const rawRows = dataRows
          .filter(r=> r.some(c=>String(c).trim()!==''))
          .map(r=>{ const obj={}; headers.forEach((h,i)=>{ if(h) obj[h]=r[i]; }); return obj; });
        this.processPeopleImportRows(rawRows);
      }catch(err){
        this.toast('No se pudo leer el archivo. Verifica el formato.');
        console.error(err);
      }
    };
    reader.readAsArrayBuffer(file);
  },

  processPeopleImportRows(rawRows){
    const stu = this.importKind==='estudiante';
    const keyOf = (name,area)=> this.normalizeKey(name)+'|'+String(area||'').toLowerCase();
    const seen = new Set(this.state.people
      .filter(p=> (p.type==='estudiante')===stu)
      .map(p=>keyOf(p.name,p.area)));
    const batch = [];
    rawRows.forEach(raw=>{
      const norm = {};
      Object.keys(raw).forEach(k=> norm[this.normalizeKey(k)] = raw[k]);
      const get = (...keys)=>{ for(const k of keys){ if(norm[k]!==undefined && String(norm[k]).trim()!=='') return String(norm[k]).trim(); } return ''; };
      const name = get(
        'nombres y apellidos','nombre y apellido','nombres','nombre completo',
        'apellidos y nombres','nombre','apellidos','estudiante','alumno'
      );
      let role='Otro', area='', status='ok', msg='Listo para importar';
      if(stu){
        role = 'Estudiante';
        area = this.normGrade(get('grado y seccion','grado y sección','grado/seccion','grado / seccion','grado seccion','grado-seccion','aula','grado y seccion (1a, 2b)'));
        if(!area){ area = this.normGrade(get('grado')+get('seccion','sección')); }
        if(!name){ status='bad'; msg='Faltan los nombres y apellidos'; }
        else if(!area){ status='bad'; msg='Falta el grado y sección'; }
      } else {
        const roleRaw = get('cargo','puesto','funcion','función','rol');
        role = roleRaw? this.mapRole(roleRaw) : 'Otro';
        area = get('area','área','area / grado','area grado','ambito','ámbito','grado y seccion','grado y sección');
        if(!name){ status='bad'; msg='Faltan los nombres y apellidos'; }
      }
      if(status!=='bad'){
        const k = keyOf(name,area);
        if(seen.has(k)){ status='bad'; msg='Ya está registrado'; }
        else seen.add(k);
      }
      batch.push({name, role, area, status, msg});
    });
    this.peopleImportRows = batch;
    this.renderPeopleImportPreview();
  },

  renderPeopleImportPreview(){
    const stu = this.importKind==='estudiante';
    const box = document.getElementById('peopleImportPreview');
    const valid = this.peopleImportRows.filter(r=>r.status!=='bad');
    if(this.peopleImportRows.length===0){ box.innerHTML=''; document.getElementById('peopleImportConfirmBtn').disabled=true; return; }
    const detected = this.lastDetectedPeopleHeaders && this.lastDetectedPeopleHeaders.length
      ? `<div class="import-help" style="margin-top:8px;">Columnas detectadas en tu archivo: ${this.lastDetectedPeopleHeaders.map(h=>`<span class="code-tag">${h}</span>`).join(' ')}</div>`
      : '';
    box.innerHTML = `
      ${detected}
      <div class="import-table-wrap">
        <table><thead><tr>${stu? '<th>Nombres y Apellidos</th><th>Grado y Sección</th>' : '<th>Nombres y Apellidos</th><th>Cargo</th><th>Área</th>'}<th>Estado</th></tr></thead><tbody>
        ${this.peopleImportRows.map(r=>`
          <tr>
            <td>${r.name||'<em>—</em>'}</td>
            ${stu? `<td>${r.area||'—'}</td>` : `<td>${r.role||'—'}</td><td>${r.area||'—'}</td>`}
            <td class="row-${r.status==='bad'?'bad':'ok'}">${r.msg}</td>
          </tr>`).join('')}
        </tbody></table>
      </div>
      <div class="import-summary">${valid.length} de ${this.peopleImportRows.length} fila(s) se importarán.
      ${valid.length===0? ' Revisa la lista de columnas detectadas arriba y ajusta los encabezados de tu Excel (por ejemplo "Nombres y Apellidos"'+(stu?' y "Grado y Sección"':'')+').':''}</div>`;
    document.getElementById('peopleImportConfirmBtn').disabled = valid.length===0;
  },

  confirmPeopleImport(){
    const stu = this.importKind==='estudiante';
    const valid = this.peopleImportRows.filter(r=>r.status!=='bad');
    valid.forEach(r=>{
      this.state.people.push({ id:this.uid(), name:r.name, role:r.role, area:r.area, type: stu? 'estudiante':'personal' });
    });
    this.save(); this.closeModal(); this.renderView();
    this.toast(`Se importaron ${valid.length} ${stu? 'estudiante(s)' : 'persona(s)'}.`);
    this.peopleImportRows = [];
  },

  loanTab:'new',
  loanCart:[],
  loanSelectedPerson:null,

  viewLoans(){

      .sort((a,b)=> new Date(a.outDate)-new Date(b.outDate));

      <button class="btn ${this.loanTab==='active'?'primary':'ghost'}" onclick="App.loanTab='active'; App.renderView();">Préstamos activos (${activos.length})</button>
    </div>
    ${this.loanTab==='new'? this.viewNewLoan() : this.viewActiveLoans(activos)}
    `;
  },

  viewNewLoan(){
    const p = this.loanSelectedPerson? this.state.people.find(x=>x.id===this.loanSelectedPerson): null;
    return `
    <section class="panel">
      <h2>1. Escanea los recursos a prestar</h2>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-8px;">La cámara ya está lista para escanear. Escanea uno tras otro (tablets, laptops, cables, etc.) y se irán agregando a la lista de abajo. También puedes usar un lector USB o escribir el código/N° de serie y presionar Enter.</p>
      <div class="field">
        <label>Código patrimonial o N° de serie</label>
        <input id="scanInput" placeholder="Escanea o escribe el código / número de serie" onkeydown="if(event.key==='Enter'){App.addToLoanCart(this.value); this.value='';}">
      </div>
      <div id="readerSlot"></div>
      <div id="cartFeedback"></div>
      <div class="panel-head" style="margin-top:16px;">
        <h2 style="font-size:14px;" id="cartHeading">Recursos listos para prestar (${this.loanCart.length})</h2>
        <span id="clearCartWrap">${this.loanCart.length>0? `<button class="btn ghost sm" onclick="App.clearLoanCart()">Vaciar lista</button>`:''}</span>
      </div>
      <div id="cartList"></div>
    </section>
    <section class="panel">
      <h2>2. Selecciona la persona</h2>
      <div class="field">
        <label>Buscar por nombre</label>
        <input id="personSearchInput" placeholder="Escribe un nombre o grado y sección (ej. 3A)..." oninput="App.renderPersonPicker(this.value)">
      </div>
      <div id="personPicker"></div>
      ${p? `<div class="found-box">Seleccionado: <strong>${p.name}</strong> — ${p.role}${p.area? ' · '+p.area:''} <button class="btn ghost sm" style="margin-left:8px;" onclick="App.loanSelectedPerson=null; App.renderView();">Cambiar</button></div>` : ''}
    </section>
    <section class="panel">
      <h2>3. Detalles del préstamo</h2>
      <div class="grid2">
        <div class="field"><label>Fecha límite de devolución (opcional)</label><input type="date" id="dueDate"></div>
        <div class="field"><label>Observaciones</label><input id="loanObs" placeholder="Ej. Aula 3B, clase de comunicación"></div>
      </div>
      <button class="btn primary" id="registerLoanBtn" onclick="App.registerLoan()">Registrar salida (${this.loanCart.length} equipo${this.loanCart.length===1?'':'s'})</button>
    </section>`;
  },

  findResourceByCode(code){
    const c = (code||'').trim().toLowerCase();
    if(!c) return null;
    return this.state.resources.find(x=> x.code.toLowerCase()===c || (x.serial && x.serial.toLowerCase()===c));
  },

  showCartFeedback(msg, isBad){
    const box = document.getElementById('cartFeedback');
    if(box) box.innerHTML = `<div class="found-box ${isBad?'bad':''}">${msg}</div>`;
  },

  addToLoanCart(code){
    code = (code||'').trim();
    if(!code) return;
    const r = this.findResourceByCode(code);
    if(!r){ this.showCartFeedback(`No se encontró ningún recurso con el código o N° de serie "${code}".`, true); return; }
    if(r.status==='prestado'){
      const loan = this.state.loans.find(l=>l.resourceId===r.id && l.status==='activo');
      this.showCartFeedback(`"${r.description}" (${r.serial || r.code}) ya está prestado a <strong>${loan?loan.personName:'—'}</strong>.`, true);
      return;
    }
    if(this.loanCart.includes(r.id)){
      this.showCartFeedback(`"${r.description}" ya está en la lista.`, true);
      return;
    }
    this.loanCart.push(r.id);
    this.showCartFeedback(`✓ Agregado: <strong>${r.description}</strong> (${r.serial || r.code}).`, false);
    this.renderLoanCart();
  },

  removeFromCart(id){
    this.loanCart = this.loanCart.filter(x=>x!==id);
    this.renderLoanCart();
  },

  clearLoanCart(){
    this.loanCart = [];
    this.renderView();
  },

  renderLoanCart(){
    const box = document.getElementById('cartList');
    if(!box) return;
    if(this.loanCart.length===0){ box.innerHTML = `<div class="empty" style="padding:16px;">Aún no has escaneado ningún recurso.</div>`; }
    else {
      box.innerHTML = this.loanCart.map(id=>{
        const r = this.state.resources.find(x=>x.id===id);
        if(!r) return '';
        return `<div class="cart-row">
          <div><strong>${r.description}</strong> <span class="code-tag">${r.serial || r.code}</span></div>
          <button class="btn danger sm" onclick="App.removeFromCart('${id}')">Quitar</button>
        </div>`;
      }).join('');
    }
    const count = this.loanCart.length;
    const heading = document.getElementById('cartHeading');
    if(heading) heading.textContent = `Recursos listos para prestar (${count})`;
    const clearWrap = document.getElementById('clearCartWrap');
    if(clearWrap) clearWrap.innerHTML = count>0? `<button class="btn ghost sm" onclick="App.clearLoanCart()">Vaciar lista</button>`:'';
    const btn = document.getElementById('registerLoanBtn');
    if(btn) btn.textContent = `Registrar salida (${count} equipo${count===1?'':'s'})`;
  },

  renderPersonPicker(q){
    const raw = (q||'').trim();
    const box = document.getElementById('personPicker');
    if(!raw){ box.innerHTML=''; return; }
    const ql = raw.toLowerCase();
    const g = this.normGrade(raw);
    // Si escribe un grado/sección (3, 3A, 5B...) se listan TODOS los estudiantes de ese grado o sección
    const isGrade = /^\d{1,2}[A-Z]?$/.test(g);
    let list;
    if(isGrade){
      list = this.state.people.filter(p=> p.type==='estudiante' && (p.area||'').toUpperCase().startsWith(g));
      list.sort((a,b)=> (a.area||'').localeCompare(b.area||'','es',{numeric:true}) || a.name.localeCompare(b.name,'es'));
    } else {
      list = this.state.people.filter(p=> p.name.toLowerCase().includes(ql) || (p.area||'').toLowerCase().includes(ql));
      list.sort((a,b)=> a.name.localeCompare(b.name,'es'));
    }
    if(list.length===0){ box.innerHTML = `<div class="empty" style="padding:12px;">Sin resultados. Regístrala primero en la sección Personas.</div>`; return; }
    const head = isGrade
      ? `<div class="pw-hint" style="margin:4px 0 8px;">${list.length} estudiante${list.length===1?'':'s'} de ${g}</div>`
      : `<div class="pw-hint" style="margin:4px 0 8px;">${list.length} resultado${list.length===1?'':'s'}</div>`;
    box.innerHTML = head + `<div class="picker-scroll">` + list.map(p=>`
      <div class="person-pick-row" onclick="App.loanSelectedPerson='${p.id}'; App.renderView();">
        <span>${p.name}</span>
        <span style="color:var(--ink-soft);font-size:12px;">${p.role}${p.area? ' · '+p.area:''}</span>
      </div>`).join('') + `</div>`;
  },

  registerLoan(){
    if(this.loanCart.length===0){ this.toast('Escanea al menos un recurso para prestar.'); return; }
    if(!this.loanSelectedPerson){ this.toast('Selecciona a la persona que recibirá el equipo.'); return; }
    const p = this.state.people.find(x=>x.id===this.loanSelectedPerson);
    const due = document.getElementById('dueDate').value;
    const obs = document.getElementById('loanObs').value.trim();
    const now = new Date().toISOString();
    let count = 0;
    this.loanCart.forEach(id=>{
      const r = this.state.resources.find(x=>x.id===id);
      if(!r || r.status==='prestado') return; // por seguridad, si algo cambió mientras tanto
      this.state.loans.push({
        id:this.uid(), resourceId:r.id, resourceCode:r.code, resourceSerial:r.serial||'', resourceName:r.description,
        personId:p.id, personName:p.name,
        outDate:now, dueDate: due? new Date(due).toISOString(): null,
        returnDate:null, status:'activo', obs, obsReturn:''
      });
      r.status = 'prestado';
      count++;
    });
    this.save();
    this.loanCart = []; this.loanSelectedPerson=null;
    this.toast(`Salida registrada: ${count} equipo${count===1?'':'s'} → ${p.name}`);
    this.renderView();
  },

  viewActiveLoans(activos){
    if(activos.length===0) return `<section class="panel"><div class="empty">No hay préstamos activos en este momento.</div></section>`;
    const now = new Date();

    // Agrupamos por persona para que se vea acumulado todo lo que tiene prestado
    const byPerson = {};
    activos.forEach(l=>{
      if(!byPerson[l.personId]) byPerson[l.personId] = { personName:l.personName, items:[] };
      byPerson[l.personId].items.push(l);
    });
    const groups = Object.values(byPerson).sort((a,b)=> b.items.length - a.items.length);

    return `
    <section class="panel">
      <h2>Devolver equipo</h2>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-8px;">La cámara ya está lista para escanear la devolución. También puedes escribir el código o N° de serie y presionar Enter.</p>
      <div class="field"><label>Código patrimonial o N° de serie</label>
        <input id="returnScanInput" placeholder="Escanea o escribe el código / número de serie" onkeydown="if(event.key==='Enter'){App.quickReturn(this.value); this.value='';}">
      </div>
      <div id="readerSlot"></div>
    </section>
    <section class="panel">
      <h2>Préstamos activos por persona (${activos.length} equipo(s) en total)</h2>
      ${groups.map(g=>`
        <div class="person-loan-group">
          <div class="person-loan-head">
            <span>${g.personName}</span>
            <span class="badge prest">${g.items.length} equipo${g.items.length>1?'s':''} prestado${g.items.length>1?'s':''}</span>
          </div>
          <table><thead><tr><th>N° Serie</th><th>Recurso</th><th>Salida</th><th>Límite</th><th>Días</th><th></th></tr></thead><tbody>
          ${g.items.map(l=>{
            const overdue = l.dueDate && new Date(l.dueDate) < now;
            const serialLabel = l.resourceSerial || l.resourceCode;
            return `<tr>
              <td><span class="code-tag">${serialLabel}</span></td>
              <td>${l.resourceName}</td>
              <td>${this.fmtDate(l.outDate)}</td>
              <td>${l.dueDate? this.fmtDate(l.dueDate): '—'} ${overdue? '<span class="badge venc">Vencido</span>':''}</td>
              <td>${this.daysBetween(new Date(l.outDate), now)} día(s)</td>
              <td style="text-align:right;"><button class="btn primary sm" onclick="App.openReturnModal('${l.id}')">Devolver</button></td>
            </tr>`;
          }).join('')}
          </tbody></table>
        </div>`).join('')}
    </section>`;
  },

  quickReturn(code){
    code = code.trim();
    const r = this.findResourceByCode(code);
    if(!r){ this.toast('No se encontró ningún recurso con ese código o N° de serie.'); return; }
    const loan = this.state.loans.find(l=>l.resourceId===r.id && l.status==='activo');
    if(!loan){ this.toast(`"${r.description}" no tiene un préstamo activo.`); return; }
    this.openReturnModal(loan.id);
  },

  openReturnModal(loanId){
    const l = this.state.loans.find(x=>x.id===loanId);
    const body = `
      <button class="close-x" onclick="App.closeModal()">✕</button>
      <h3>Registrar devolución</h3>
      <p style="font-size:13px;">Recurso: <strong>${l.resourceName}</strong> (${l.resourceSerial || l.resourceCode})<br>Prestado a: <strong>${l.personName}</strong> el ${this.fmtDate(l.outDate)}</p>
      <div class="field"><label>Observaciones de devolución (opcional)</label>
        <textarea id="retObs" rows="2" placeholder="Ej. Se devolvió en buen estado"></textarea></div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="App.closeModal()">Cancelar</button>
        <button class="btn primary" onclick="App.confirmReturn('${loanId}')">Confirmar devolución</button>
      </div>`;
    this.showModal(body);
  },

  confirmReturn(loanId){
    const l = this.state.loans.find(x=>x.id===loanId);
    l.returnDate = new Date().toISOString();
    l.status = 'devuelto';
    l.obsReturn = document.getElementById('retObs').value.trim();
    const r = this.state.resources.find(x=>x.id===l.resourceId);
    if(r) r.status = 'disponible';
    this.save(); this.closeModal();
    this.toast('Devolución registrada.');
    this.renderView();
  },

  /* Cámara QR — se inicia una sola vez y nunca se apaga al cambiar de pestaña.
     El div #qrHolder vive fuera del área que se re-renderiza; solo lo movemos
     de lugar (attach/detach) según la pestaña activa, sin destruir el video. */
  camReader:null, camActive:false, camStarting:false,
  camTargetInput:'scanInput', camLastCode:null, camLastTime:0,

  beep(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      const ctx = new Ctx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 1000;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.18);
      o.connect(g); g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime+0.2);
      o.onended = ()=>{ ctx.close().catch(()=>{}); };
    }catch(e){ /* audio no disponible, no interrumpe el escaneo */ }
  },

  // Mueve el visor de cámara al slot de la pestaña activa y lo muestra.
  attachCameraDock(targetInput){
    this.camTargetInput = targetInput || 'scanInput';
    const slot = document.getElementById('readerSlot');
    const holder = document.getElementById('qrHolder');
    if(!slot || !holder) return;
    slot.appendChild(holder);
    holder.style.display = 'block';
    this.startCameraOnce();
  },

  // Saca el visor del contenido que se va a reemplazar y lo guarda oculto,
  // pero SIN detener la cámara: el flujo de video sigue activo en segundo plano.
  detachCameraDock(){
    const holder = document.getElementById('qrHolder');
    if(!holder) return;
    if(holder.parentElement !== document.body){
      document.body.appendChild(holder);
    }
    holder.style.display = 'none';
  },

  // Arranca la cámara una sola vez; en las siguientes visitas a Préstamos
  // solo se reutiliza la misma transmisión (nunca se vuelve a pedir permiso).
  startCameraOnce(){
    if(this.camActive || this.camStarting) return;
    const box = document.getElementById('reader');
    if(!box) return;
    if(typeof Html5Qrcode === 'undefined'){
      box.insertAdjacentHTML('afterend', '<div class="found-box bad">El escáner de cámara no cargó. Usa el código manual o un lector USB.</div>');
      return;
    }
    this.camStarting = true;
    this.camReader = new Html5Qrcode('reader');
    this.camReader.start(
      { facingMode:'environment' },
      {
        fps:12,
        qrbox:(viewfinderWidth, viewfinderHeight)=>{
          const size = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.8);
          return { width:size, height:size };
        },
        aspectRatio: 1.0,
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
      },
      (text)=>{
        const now = Date.now();
        if(text===this.camLastCode && now-this.camLastTime<4000) return; // evita duplicados del mismo código
        this.camLastCode = text; this.camLastTime = now;
        this.beep();
        const input = document.getElementById(this.camTargetInput);
        if(input) input.value = text;
        if(this.camTargetInput==='scanInput') this.addToLoanCart(text); else this.quickReturn(text);
      },
      ()=>{}
    ).then(()=>{ this.camActive = true; this.camStarting = false; }).catch(()=>{
      this.camStarting = false;
      box.insertAdjacentHTML('afterend', '<div class="found-box bad">No se pudo acceder a la cámara. Verifica los permisos del navegador o usa el código manual / un lector USB.</div>');
    });
  },

  /* ---------------------------------------------------------
     HISTORIAL
  --------------------------------------------------------- */
  histFilter:{ q:'', status:'todos' },
  viewHistory(){
    const q = this.histFilter.q.toLowerCase();
    let list = [...this.state.loans].sort((a,b)=> new Date(b.outDate)-new Date(a.outDate));
    if(this.histFilter.status!=='todos') list = list.filter(l=>l.status===this.histFilter.status);
    if(q) list = list.filter(l=> l.resourceName.toLowerCase().includes(q) || l.resourceCode.toLowerCase().includes(q) || (l.resourceSerial||'').toLowerCase().includes(q) || l.personName.toLowerCase().includes(q));
    return `
    <section class="panel">
      <div class="panel-head"><h2>Historial (${list.length})</h2>
        <button class="btn ghost" onclick="App.exportCsv()">⬇ Exportar CSV</button>
      </div>
      <div class="searchbar">
        <input id="histSearchInput" placeholder="Buscar recurso, código o persona..." value="${this.histFilter.q}" oninput="App.histFilter.q=this.value; App.renderView();">
        <select onchange="App.histFilter.status=this.value; App.renderView();">
          <option value="todos" ${this.histFilter.status==='todos'?'selected':''}>Todos los estados</option>
          <option value="activo" ${this.histFilter.status==='activo'?'selected':''}>Activos</option>
          <option value="devuelto" ${this.histFilter.status==='devuelto'?'selected':''}>Devueltos</option>
        </select>
      </div>
      ${list.length===0? `<div class="empty">No hay movimientos que coincidan con el filtro.</div>` : `
      <table><thead><tr><th>Recurso</th><th>Persona</th><th>Salida</th><th>Devolución</th><th>Estado</th><th>Obs.</th></tr></thead><tbody>
      ${list.map(l=>`
        <tr>
          <td><span class="code-tag">${l.resourceSerial || l.resourceCode}</span> ${l.resourceName}</td>
          <td>${l.personName}</td>
          <td>${this.fmtDate(l.outDate)}</td>
          <td>${l.returnDate? this.fmtDate(l.returnDate): '—'}</td>
          <td>${l.status==='activo'? '<span class="badge prest">Activo</span>':'<span class="badge dev">Devuelto</span>'}</td>
          <td style="max-width:220px;font-size:12px;color:var(--ink-soft);">${l.obs||''} ${l.obsReturn? '· '+l.obsReturn:''}</td>
        </tr>`).join('')}
      </tbody></table>`}
    </section>`;
  },

  exportCsv(){
    const rows = [['N Serie','Codigo Patrimonial','Recurso','Persona','Salida','Devolucion','Estado','Observaciones salida','Observaciones devolucion']];
    this.state.loans.forEach(l=> rows.push([l.resourceSerial||'',l.resourceCode,l.resourceName,l.personName,this.fmtDate(l.outDate),l.returnDate?this.fmtDate(l.returnDate):'',l.status,l.obs||'',l.obsReturn||'']));
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'historial-prestamos.csv'; a.click();
  },

  /* ---------------------------------------------------------
     ETIQUETAS QR
  --------------------------------------------------------- */
  viewLabels(){
    if(this.state.resources.length===0) return `<section class="panel"><div class="empty">Agrega recursos en la sección "Recursos" para generar sus etiquetas QR.</div></section>`;
    return `
    <section class="panel">
      <div class="panel-head"><h2>Etiquetas para imprimir</h2>
        <button class="btn primary no-print" onclick="window.print()">🖨 Imprimir todas</button>
      </div>
      <div class="labels-grid" id="labelsGrid">
        ${this.state.resources.map(r=>{
          const label = r.serial || r.code;
          return `
          <div class="label-card">
            <div id="lbl-${r.id}"></div>
            <div class="qcode">${label}</div>
            ${!r.serial? `<div class="qname" style="color:var(--amber-dark);">(sin N° serie, usando código patrimonial)</div>`:''}
            <div class="qname">${r.description}</div>
          </div>`;
        }).join('')}
      </div>
    </section>`;
  },

  renderAllLabelQrs(){
    this.state.resources.forEach(r=>{
      const el = document.getElementById('lbl-'+r.id);
      if(el && !el.hasChildNodes()){
        const label = r.serial || r.code;
        new QRCode(el, { text:label, width:110, height:110, colorDark:'#10293A', colorLight:'#ffffff' });
      }
    });
  },

  /* ---------------------------------------------------------
     CONFIGURACIÓN / MODAL / BACKUP
  --------------------------------------------------------- */
  openSettings(){
    const body = `
      <button class="close-x" onclick="App.closeModal()">✕</button>
      <h3>Datos de la institución</h3>
      <div class="field"><label>Nombre de la institución / aula</label>
        <input id="sInst" value="${this.state.settings.institutionName.replace(/"/g,'&quot;')}"></div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="App.closeModal()">Cancelar</button>
        <button class="btn primary" onclick="App.saveSettings()">Guardar</button>
      </div>`;
    this.showModal(body);
  },
  saveSettings(){
    this.state.settings.institutionName = document.getElementById('sInst').value.trim() || 'I.E. "JOSÉ SANTOS FIGUEROA"';
    this.save(); this.closeModal(); this.renderNav(); this.renderView();
  },

  openSyncModal(){
    const cfgStr = this.syncConfig? JSON.stringify(this.syncConfig, null, 2) : '';
    const statusLine = {
      on:'<span class="sync-dot on"></span> Conectado — los préstamos y devoluciones se ven al instante en todas las computadoras y celulares.',
      connecting:'<span class="sync-dot connecting"></span> Conectando...',
      error:'<span class="sync-dot error"></span> No se pudo conectar. Revisa la configuración de abajo.',
      off:'<span class="sync-dot off"></span> Todavía no está activada. Ahora mismo cada computadora guarda sus datos por separado.'
    }[this.syncStatus];
    const body = `
      <button class="close-x" onclick="App.closeModal()">✕</button>
      <h3>🌐 Ver préstamos y devoluciones en línea</h3>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-8px;">
        Esto <strong>no cambia nada de tu institución</strong> ni de tus datos actuales. Solo conecta este mismo
        panel a internet para que, cuando registres un préstamo o una devolución desde una computadora o celular,
        se vea al instante en los demás equipos — sin recargar la página.
      </p>
      <p style="font-size:13px;margin:10px 0;">${statusLine}</p>
      <p style="font-size:12.5px;color:var(--ink-soft);">
        Se necesita una cuenta gratuita de <strong>Firebase</strong> (Google) que actúa como el "punto de encuentro" en línea. Se hace una sola vez:
      </p>
      <ol style="font-size:12.5px;color:var(--ink-soft);padding-left:18px;margin:8px 0;">
        <li>Entra a <strong>console.firebase.google.com</strong> y crea un proyecto (gratis).</li>
        <li>Dentro del proyecto, activa <strong>Firestore Database</strong>.</li>
        <li>Ve a "Configuración del proyecto" → "Tus apps" → agrega una app web y copia el objeto <code>firebaseConfig</code>.</li>
        <li>Pega ese objeto completo aquí abajo y presiona "Conectar".</li>
        <li>Pega esa misma configuración en cada computadora o celular donde uses el sistema.</li>
      </ol>
      <div class="field"><label>Configuración de Firebase (firebaseConfig)</label>
        <textarea id="syncCfg" rows="6" placeholder='{
  "apiKey": "...",
  "authDomain": "...",
  "projectId": "...",
  "appId": "..."
}'>${cfgStr}</textarea>
      </div>
      <div class="modal-actions" style="justify-content:flex-start;">
        <button class="btn primary" onclick="App.applySyncConfig()">Conectar</button>
        ${this.syncConfig && !EMBEDDED_FIREBASE_CONFIG? `<button class="btn danger" onclick="App.disconnectSyncFromUI()">Desconectar</button>`:''}
      </div>
      ${EMBEDDED_FIREBASE_CONFIG
        ? `<div class="embed-box">✓ Esta copia del sistema ya incluye la conexión en línea: cualquier persona que abra el link verá los datos sin configurar nada.</div>`
        : (this.syncConfig
          ? `<div class="embed-box"><strong>Para que cualquier persona que abra el link vea los equipos prestados sin pegar nada:</strong><br>
              descarga una copia con la conexión incluida y publícala (reemplaza el index.html en GitHub/Netlify/Firebase).<br>
              <button class="btn primary sm" style="margin-top:8px;" onclick="App.downloadEmbeddedHtml()">⬇ Descargar index.html con la conexión incluida</button></div>`
          : '')}
      <div class="modal-actions" style="margin-top:20px;">
        <button class="btn ghost" onclick="App.closeModal()">Cerrar</button>
      </div>`;
    this.showModal(body);
  },

  async applySyncConfig(){
    const raw = document.getElementById('syncCfg').value.trim();
    if(!raw){ this.toast('Pega la configuración de Firebase (firebaseConfig).'); return; }
    let cfg;
    try{ cfg = JSON.parse(raw); }
    catch(e){ this.toast('Ese texto no es un JSON válido. Copia el objeto firebaseConfig completo.'); return; }
    if(!cfg.projectId || !cfg.apiKey){ this.toast('Faltan datos (apiKey / projectId) en la configuración.'); return; }
    this.toast('Conectando...');
    const ok = await this.connectSync(cfg);
    if(ok){
      this.toast('✓ Conectado. Ahora los préstamos se ven en tiempo real.');
      await this.save(); // sube el estado actual para que otros equipos lo reciban
      this.closeModal(); this.renderNav(); this.renderView();
    } else {
      this.toast('No se pudo conectar. Verifica la configuración y que Firestore esté activado.');
    }
  },

  async downloadEmbeddedHtml(){
    if(!this.syncConfig){ this.toast('Primero conecta Firebase.'); return; }
    try{
      const res = await fetch(location.href.split('#')[0]);
      let txt = await res.text();
      const marker = 'const EMBEDDED_FIREBASE_CONFIG = ' + 'null;';
      if(!txt.includes(marker)){ this.toast('Este archivo ya trae una conexión incluida.'); return; }
      txt = txt.replace(marker, ()=> 'const EMBEDDED_FIREBASE_CONFIG = ' + JSON.stringify(this.syncConfig) + ';');
      const blob = new Blob([txt], {type:'text/html;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'index.html'; a.click();
      this.toast('Listo: sube este nuevo index.html a tu hosting.');
    }catch(e){
      this.toast('No se pudo generar desde este modo de apertura. Publica el sistema en un link (GitHub/Netlify) y repite este paso desde ahí.');
    }
  },

  disconnectSyncFromUI(){
    this.disconnectSync();
    this.closeModal(); this.renderNav(); this.renderView();
    this.toast('Sincronización en línea desactivada. Ahora se guarda solo en este navegador.');
  },

  exportBackup(){
    const blob = new Blob([JSON.stringify(this.state,null,2)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'respaldo-control-aip.json'; a.click();
  },

  showModal(html){
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('overlay').classList.add('show');
  },
  closeModal(){ document.getElementById('overlay').classList.remove('show'); }
};

// Candado: estas acciones solo funcionan con sesión de administrador
['registerLoan','confirmReturn','openReturnModal','quickReturn','addToLoanCart','removeFromCart','clearLoanCart',
 'openResourceForm','saveResource','deleteResource','openImportExcel','confirmImport',
 'openPersonForm','savePerson','openStudentForm','saveStudent','deletePerson','openImportPeopleExcel','confirmPeopleImport',
 'openSettings','saveSettings','openSyncModal','applySyncConfig','disconnectSyncFromUI','downloadEmbeddedHtml','exportBackup',
 'openChangePassword','submitChangePassword'
].forEach(name=>{
  const fn = App[name];
  if(typeof fn !== 'function') return;
  App[name] = function(...args){
    if(!App.isAdmin){ App.toast('Esta acción es solo para el administrador.'); return; }
    return fn.apply(App, args);
  };
});

document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') App.closeModal(); });
App.load();
</script>
</body>
